<script>
  const GROUPS = ['completed', 'cancelled', 'refunded', 'in_progress', 'unclassified'];
  const GLABEL = { completed: 'Completed', cancelled: 'Cancelled', refunded: 'Refunded',
                   in_progress: 'In progress', unclassified: 'Unclassified' };
  const SCOL = { completed: '#14b8a6', cancelled: '#ef4444', refunded: '#f59e0b',
                 in_progress: '#3b82f6', unclassified: '#94a3b8' };
  const AGE_ORDER = ['18-25', '26-35', '36-45', '46-60', '61+'];
  const MIN_ORDERS = 500, MIN_STATE = 100, MIN_CITY = 30;
  const PAGE_TITLES = { overview: 'Overview', product: 'Product & Category Performance',
    geo: 'Geographic Sales Analysis', pay: 'Payment & Order Status Analysis', customers: 'Customers' };
  const PAGE_SUBS = {
    overview: 'Key numbers and the revenue trend at a glance',
    product: 'Best-selling products, and which categories earn less or lose more orders',
    geo: 'Where sales are strong, weak or at risk',
    pay: 'How customers pay, and which methods end in cancelled orders',
    customers: 'Who is buying: gender and age' };
  const PALS = {
    dark:  ['#22d3ee', '#3b82f6', '#14b8a6', '#a78bfa', '#f59e0b', '#f472b6', '#84cc16', '#fb7185'],
    light: ['#2563eb', '#0ea5e9', '#14b8a6', '#8b5cf6', '#f59e0b', '#ec4899', '#65a30d', '#ef4444']
  };
  // US tile-grid map: [column, row]
  const TILES = {
    AK: [0, 0], ME: [10, 0],
    VT: [9, 1], NH: [10, 1],
    WA: [0, 2], ID: [1, 2], MT: [2, 2], ND: [3, 2], MN: [4, 2], IL: [5, 2], WI: [6, 2], MI: [7, 2], NY: [8, 2], MA: [9, 2], RI: [10, 2],
    OR: [0, 3], NV: [1, 3], WY: [2, 3], SD: [3, 3], IA: [4, 3], IN: [5, 3], OH: [6, 3], PA: [7, 3], NJ: [8, 3], CT: [9, 3],
    CA: [0, 4], UT: [1, 4], CO: [2, 4], NE: [3, 4], MO: [4, 4], KY: [5, 4], WV: [6, 4], VA: [7, 4], MD: [8, 4], DE: [9, 4],
    AZ: [1, 5], NM: [2, 5], KS: [3, 5], AR: [4, 5], TN: [5, 5], NC: [6, 5], SC: [7, 5], DC: [8, 5],
    OK: [3, 6], LA: [4, 6], MS: [5, 6], AL: [6, 6], GA: [7, 6],
    HI: [0, 7], TX: [3, 7], FL: [8, 7]
  };

  let CUBE, D, MONTHS, ORDN, CATN, CUS, F, VG, VLAB, STOK, resizeTimer, CTX;
  let EX = null, EXERR = '';
  let PAGE = 'overview';
  const SEG = { map: 'rev', pm: 'rev' };
  const SORT = {};
  const charts = {};

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  const fmt2 = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const short = n => {
    const a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n * 10) / 10);
  };
  const pctAbs = p => (Math.abs(p) >= 100 ? Math.abs(p).toFixed(0) : Math.abs(p).toFixed(1)) + '%';
  const pctTxt = p => (p >= 0 ? '+' : '-') + pctAbs(p);
  const round2 = x => Math.round(x * 100) / 100;
  const sum = a => a.reduce((x, y) => x + y, 0);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const elig = x => x.o[0] + x.o[1] + x.o[2];
  const rate = x => elig(x) ? x.o[1] / elig(x) * 100 : null;

  // ---------- theme helpers ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const theme = () => document.documentElement.getAttribute('data-theme');
  const pal = () => PALS[theme()];
  const hexA = (hex, a) => {
    const h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.substr(0, 2), 16) + ',' + parseInt(h.substr(2, 2), 16) + ',' + parseInt(h.substr(4, 2), 16) + ',' + a + ')';
  };
  const LG = (x, y, x2, y2, stops) => new echarts.graphic.LinearGradient(x, y, x2, y2, stops);

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('sp_theme', t); } catch (e) {}
    $('themeLbl').textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  }
  (function () {
    let t = 'dark';
    try { t = localStorage.getItem('sp_theme') || 'dark'; } catch (e) {}
    setTheme(t);
  })();

  // ---------- load ----------
  if (typeof echarts === 'undefined') {
    $('msg').textContent = 'Chart library could not be loaded (cdn.jsdelivr.net blocked?). Check the network and reload.';
  } else {
    google.script.run
      .withSuccessHandler(c => { CUBE = c; init(); })
      .withFailureHandler(e => { $('msg').textContent = 'Error: ' + e.message; })
      .getCube();
  }

  function init() {
    D = CUBE.dims;
    MONTHS = D.month.map((name, i) => ({ name: name, i: i })).sort((a, b) => a.name < b.name ? -1 : 1);
    const rank = [];
    MONTHS.forEach((m, r) => rank[m.i] = r);

    ORDN = CUBE.ord.map(a => ({ m: rank[a[0]], st: a[1], pay: a[2], g: a[3], c: -1, o: a[4], v: a[6] }));
    CATN = CUBE.cat.map(a => ({ m: rank[a[0]], st: a[1], pay: a[2], g: a[3], c: a[4], o: a[5], v: a[7] }));
    CUS = CUBE.cus.map(a => ({ m: rank[a[0]], g: a[1], ge: a[2], ag: a[3], v: a[6] }));

    const byName = (a, b) => a[1] < b[1] ? -1 : 1;
    fill('fFrom', MONTHS.map((m, r) => [r, m.name]), 0);
    fill('fTo', MONTHS.map((m, r) => [r, m.name]), MONTHS.length - 1);
    const regions = Array.from(new Set(Object.values(CUBE.regionOf))).sort();
    fill('fRegion', [['All', 'All regions']].concat(regions.map(r => [r, r])));
    fill('fCat', [['All', 'All categories']].concat(D.cat.map((c, i) => [i, c]).sort(byName)));
    fill('fStatus', [['All', 'All statuses']].concat(GROUPS.map(g => [g, GLABEL[g]])));
    fill('fPay', [['All', 'All payment methods']].concat(D.pay.map((p, i) => [i, p]).sort(byName)));

    document.querySelectorAll('.f').forEach(e => e.onchange = render);
    $('fReset').onclick = resetFilters;
    $('themeBtn').onclick = () => { setTheme(theme() === 'dark' ? 'light' : 'dark'); render(); };
    document.querySelectorAll('.nav[data-page]').forEach(b => b.onclick = () => goPage(b.dataset.page));
    document.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
      SEG[g.dataset.seg] = b.dataset.v;
      g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      drawPage();
    }));
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 250); });

    $('sub').textContent = PAGE_SUBS[PAGE];
    $('built').textContent = 'Cube built ' + CUBE.built;
    $('msg').style.display = 'none';
    $('app').style.display = 'block';
    render();
    loadExtras();
  }

  // product + city tables (separate, built by buildExtras in Code.gs)
  function loadExtras() {
    google.script.run
      .withSuccessHandler(x => { try { EX = prepExtras(x); EXERR = ''; } catch (e) { EXERR = e.message; } if (CTX) drawPage(); })
      .withFailureHandler(e => { EXERR = e.message || 'failed'; if (CTX) drawPage(); })
      .getExtras();
  }

  function prepExtras(x) {
    const mrank = {};
    MONTHS.forEach((m, r) => mrank[m.name] = r);
    const mm = x.months.map(n => n in mrank ? mrank[n] : -1);
    return {
      skus: x.skus, skuCat: x.skuCat, cities: x.cities, cityState: x.cityState, cityRegion: x.cityRegion,
      prod: x.prod.map(a => ({ s: a[0], m: mm[a[1]], rg: x.regions[a[2]], co: a[3], cl: a[4], v: a[5], ca: a[6], rf: a[7] }))
                  .filter(r => r.m >= 0),
      city: x.city.map(a => ({ c: a[0], m: mm[a[1]], co: a[2], ca: a[3], rf: a[4], v: a[5] }))
                  .filter(r => r.m >= 0)
    };
  }
  const exMsg = () => EXERR
    ? 'Product/city data is not ready. In Apps Script run buildExtras() once, then reload.'
    : 'Loading product and city data...';

  function fill(id, opts, sel) {
    const s = $(id);
    s.innerHTML = '';
    opts.forEach(o => s.add(new Option(o[1], o[0])));
    if (sel !== undefined) s.value = String(sel);
  }

  function resetFilters() {
    $('fFrom').value = '0';
    $('fTo').value = String(MONTHS.length - 1);
    ['fRegion', 'fCat', 'fStatus', 'fPay'].forEach(id => $(id).value = 'All');
    render();
  }

  function goPage(p) {
    PAGE = p;
    document.querySelectorAll('.nav[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === p));
    Object.keys(PAGE_TITLES).forEach(k => $('p_' + k).style.display = k === p ? 'block' : 'none');
    $('ptitle').textContent = PAGE_TITLES[p];
    $('sub').textContent = PAGE_SUBS[p];
    if (CTX) drawPage();
  }

  // ---------- data layer (unchanged logic) ----------
  function pick(opt) {
    opt = opt || {};
    const useCat = !!opt.byCat || F.cat !== 'All';
    const src = useCat ? CATN : ORDN;
    const catSel = (F.cat !== 'All' && !opt.skipCat) ? +F.cat : null;
    const payF = F.pay === 'All' ? null : +F.pay;
    const gF = (F.status === 'All' || opt.skipStatus) ? null : GROUPS.indexOf(F.status);
    return src.filter(r =>
      r.m >= F.from && r.m <= F.to && STOK[r.st] &&
      (payF === null || r.pay === payF) &&
      (catSel === null || r.c === catSel) &&
      (gF === null || r.g === gF));
  }

  function groupBy(rows, keyFn) {
    const m = {};
    rows.forEach(r => {
      const k = keyFn(r);
      const x = m[k] || (m[k] = { o: [0, 0, 0, 0, 0, 0], v: [0, 0, 0, 0, 0, 0] });
      x.o[r.g] += r.o;
      x.v[r.g] += r.v;
    });
    return m;
  }

  function topN(map, labelFn, valFn, n) {
    return Object.keys(map).map(k => [labelFn(k), valFn(map[k])])
      .sort((a, b) => b[1] - a[1]).slice(0, n);
  }

  function rateRows(map, labelFn) {
    return Object.keys(map).filter(k => elig(map[k]) >= MIN_ORDERS)
      .map(k => [labelFn(k), Number(rate(map[k]).toFixed(1))])
      .sort((a, b) => b[1] - a[1]).slice(0, 15);
  }

  // ---------- chart helpers ----------
  function chart(id, option) {
    const el = $(id);
    let c = charts[id];
    if (c && c.getDom() !== el) { c.dispose(); c = null; }
    if (!c) { c = echarts.init(el); charts[id] = c; }
    c.resize();
    c.setOption(Object.assign({
      backgroundColor: 'transparent',
      textStyle: { color: css('--mut'), fontFamily: css('--font') },
      animationDuration: 600
    }, option), true);
    return c;
  }

  const ax = () => ({
    axisLine: { lineStyle: { color: css('--line') } }, axisTick: { show: false },
    axisLabel: { color: css('--mut'), fontSize: 11 }, splitLine: { lineStyle: { color: css('--line') } }
  });
  const tip = () => ({
    backgroundColor: css('--card'), borderColor: css('--line'), borderWidth: 1,
    textStyle: { color: css('--ink'), fontSize: 12 }
  });

  function noData(id, msg) {
    chart(id, { title: { text: msg || 'No data', left: 'center', top: 'middle',
      textStyle: { color: css('--mut'), fontSize: 13, fontWeight: 'normal' } } });
  }

  function bars(id, rows, o) {
    o = o || {};
    if (!rows.length) return noData(id);
    const hor = !!o.h;
    const a = o.c1 || css('--brand'), b = o.c2 || css('--brand2');
    const f = o.f || short;
    const cat = Object.assign({ type: 'category', data: rows.map(r => r[0]), inverse: hor }, ax(),
      { splitLine: { show: false } });
    if (hor) cat.axisLabel = { color: css('--ink'), fontSize: 12, width: o.lw || 130, overflow: 'truncate' };
    else cat.axisLabel = { color: css('--mut'), fontSize: 11, interval: 0, rotate: rows.length > 8 ? 35 : 0 };
    const val = Object.assign({ type: 'value' }, ax(), { axisLabel: { color: css('--mut'), fontSize: 11, formatter: f } });
    chart(id, {
      tooltip: Object.assign(tip(), { trigger: 'axis', axisPointer: { type: 'shadow' },
        valueFormatter: v => o.tipf ? o.tipf(v) : fmt(v) }),
      grid: { left: 10, right: hor ? 56 : 16, top: 20, bottom: 10, containLabel: true },
      xAxis: hor ? val : cat,
      yAxis: hor ? cat : val,
      series: [{
        type: 'bar', data: rows.map(r => r[1]), barMaxWidth: 28,
        itemStyle: { borderRadius: hor ? [0, 6, 6, 0] : [6, 6, 0, 0],
                     color: LG(0, hor ? 0 : 1, hor ? 1 : 0, 0, [{ offset: 0, color: hexA(b, .85) }, { offset: 1, color: a }]) },
        label: { show: rows.length <= 16, position: hor ? 'right' : 'top', color: css('--mut'), fontSize: 11,
                 formatter: p => f(p.value) }
      }]
    });
  }

  function donut(id, rows, o) {
    o = o || {};
    if (!rows.length) return noData(id);
    const narrow = $(id).clientWidth < 440;
    const total = sum(rows.map(r => r[1]));
    chart(id, {
      color: o.colors || pal(),
      tooltip: Object.assign(tip(), { trigger: 'item',
        formatter: p => esc(p.name) + '<br/><b>' + fmt(p.value) + '</b> (' + p.percent + '%)' }),
      legend: { type: 'scroll', orient: narrow ? 'horizontal' : 'vertical', bottom: narrow ? 0 : 'middle',
                right: narrow ? 'center' : 4, top: narrow ? undefined : 'middle',
                textStyle: { color: css('--mut'), fontSize: 11 }, icon: 'circle', itemHeight: 8, itemWidth: 8 },
      title: { text: short(total), subtext: o.sub || '', left: narrow ? '50%' : '34%', top: narrow ? '36%' : '40%',
               textAlign: 'center', textStyle: { color: css('--ink'), fontSize: 22, fontWeight: 800 },
               subtextStyle: { color: css('--mut'), fontSize: 11 } },
      series: [{
        type: 'pie', radius: ['56%', '78%'], center: [narrow ? '50%' : '34%', narrow ? '46%' : '50%'],
        avoidLabelOverlap: true, label: { show: false }, labelLine: { show: false },
        itemStyle: { borderRadius: 8, borderColor: css('--card'), borderWidth: 3 },
        emphasis: { scaleSize: 6 },
        data: rows.map(r => ({ name: r[0], value: r[1] }))
      }]
    });
  }

  function spark(id, data, color) {
    chart(id, {
      animation: false, tooltip: { show: false },
      grid: { left: 0, right: 0, top: 6, bottom: 0 },
      xAxis: { type: 'category', show: false, boundaryGap: false, data: data.map((_, i) => i) },
      yAxis: { type: 'value', show: false, scale: true },
      series: [{ type: 'line', smooth: true, symbol: 'none', data: data,
                 lineStyle: { width: 2, color: color },
                 areaStyle: { color: LG(0, 0, 0, 1, [{ offset: 0, color: hexA(color, .35) }, { offset: 1, color: hexA(color, 0) }]) } }]
    });
  }

  // ranked list with inline bars: rows = [{name, val, txt(html), sub, mono, color:[c1,c2]}]
  function leader(id, rows, o) {
    o = o || {};
    const el = $(id);
    el.className = 'lb' + (o.compact ? ' compact' : '');
    if (!rows.length) { el.innerHTML = '<div class="mut">No data</div>'; return; }
    const mx = Math.max.apply(null, rows.map(r => r.val).concat([1e-9]));
    el.innerHTML = (o.note ? '<div class="lb-note">' + esc(o.note) + '</div>' : '') + rows.map((r, i) => {
      const c = r.color || [css('--brand2'), css('--brand')];
      return '<div class="lb-r"><span class="rk' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</span><div class="lb-c">' +
        '<div class="lb-top"><span class="nm' + (r.mono ? ' mono' : '') + '" title="' + esc(r.name) + '">' + esc(r.name) +
        '</span><b class="vl">' + r.txt + '</b></div>' +
        '<div class="lb-bar"><i style="width:' + Math.max(2, r.val / mx * 100) + '%;background:linear-gradient(90deg,' +
        c[0] + ',' + c[1] + ')"></i></div>' +
        (r.sub && !o.compact ? '<div class="lb-sub">' + esc(r.sub) + '</div>' : '') + '</div></div>';
    }).join('');
  }

  // sortable table: cols = [{k, t, num, f(v,row), bar}]
  function table(id, cols, rows, o) {
    o = o || {};
    const el = $(id);
    const startKey = o.sort || cols[0].k;
    const s = SORT[id] || (SORT[id] = { k: startKey, d: cols.find(c => c.k === startKey).num ? -1 : 1 });
    const data = rows.slice().sort((a, b) => {
      const x = a[s.k], y = b[s.k];
      const xn = x === null || x === undefined, yn = y === null || y === undefined;
      if (xn || yn) return xn && yn ? 0 : xn ? 1 : -1;
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * s.d;
    }).slice(0, o.max || 200);
    const mx = {};
    cols.forEach(c => { if (c.bar) mx[c.k] = Math.max.apply(null, data.map(r => r[c.k] || 0).concat([1e-9])); });
    const head = cols.map(c => '<th class="s' + (c.num ? ' num' : '') + '" data-k="' + c.k + '">' + esc(c.t) +
      (s.k === c.k ? (s.d < 0 ? ' ▼' : ' ▲') : '') + '</th>').join('');
    const body = data.map(r => '<tr>' + cols.map(c => {
      const v = r[c.k];
      let txt = c.f ? c.f(v, r) : (typeof v === 'string' ? esc(v) : v);
      if (txt === null || txt === undefined) txt = '-';
      if (c.bar && v) txt += '<div class="bar" style="width:' + Math.max(3, v / mx[c.k] * 100) + '%"></div>';
      return '<td' + (c.num ? ' class="num"' : '') + '>' + txt + '</td>';
    }).join('') + '</tr>').join('');
    el.innerHTML = '<div class="scroll"><table class="tbl"><thead><tr>' + head + '</tr></thead><tbody>' + body +
      '</tbody></table></div>';
    el.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (s.k === k) s.d = -s.d; else { s.k = k; s.d = cols.find(c => c.k === k).num ? -1 : 1; }
      table(id, cols, rows, o);
    });
  }

  const trendCell = v => v === null || v === undefined ? '-' :
    '<b class="' + (v >= 0 ? 'pos' : 'neg') + '">' + (v >= 0 ? '▲ ' : '▼ ') + pctAbs(v) + '</b>';
  const ratePct = v => v === null || v === undefined ? '-' : v.toFixed(1) + '%';

  function answerCard(cls, q, a, d) {
    return '<div class="card ans ' + cls + '"><div class="q">' + esc(q) + '</div><div class="a">' + esc(a) +
           '</div><div class="d">' + esc(d) + '</div></div>';
  }

  // ---------- render ----------
  function render() {
    F = { from: +$('fFrom').value, to: +$('fTo').value, region: $('fRegion').value,
          cat: $('fCat').value, status: $('fStatus').value, pay: $('fPay').value };
    $('warn').textContent = '';
    if (F.from > F.to) {
      $('warn').textContent = 'Start month is after the end month. Please change the range.';
      return;
    }

    STOK = D.state.map(s => F.region === 'All' || CUBE.regionOf[s] === F.region);
    VG = F.status === 'All' ? 0 : GROUPS.indexOf(F.status);
    VLAB = VG === 0 ? 'revenue (completed orders)' : 'value of ' + GLABEL[GROUPS[VG]].toLowerCase() + ' orders';

    const base = pick({ skipStatus: true });
    if (!base.length) {
      CTX = null;
      $('empty').style.display = 'block';
      $('dash').style.display = 'none';
      return;
    }
    $('empty').style.display = 'none';
    $('dash').style.display = 'block';
    document.querySelectorAll('[data-t]').forEach(e => e.textContent = e.dataset.t.replace('{v}', VLAB));

    const T = groupBy(base, () => 'all').all;
    const byM = groupBy(base, r => r.m);
    const mIdx = [];
    for (let i = F.from; i <= F.to; i++) mIdx.push(i);
    const series = mIdx.map(i => byM[i] ? byM[i].v[VG] : 0);
    const n = series.length;
    let mom = null;
    if (n >= 2 && series[n - 2] > 0) mom = (series[n - 1] / series[n - 2] - 1) * 100;
    const done = T.o[0], canc = T.o[1], ref = T.o[2], eligible = done + canc + ref;

    CTX = {
      base: base, T: T, byM: byM, mIdx: mIdx, series: series, n: n, mom: mom, done: done,
      overall: eligible ? canc / eligible * 100 : null,
      totalOrders: F.status === 'All' ? sum(T.o.slice(0, 5)) : T.o[VG],
      byS: groupBy(base, r => r.st),
      byR: groupBy(base, r => CUBE.regionOf[D.state[r.st]]),
      byC: groupBy(pick({ byCat: true, skipCat: true, skipStatus: true }), r => r.c),
      byP: groupBy(base, r => r.pay)
    };
    drawPage();
  }

  function drawPage() {
    if (!CTX) return;
    if (PAGE === 'overview') drawOverview();
    else if (PAGE === 'product') drawProduct();
    else if (PAGE === 'geo') drawGeo();
    else if (PAGE === 'pay') drawPay();
    else drawCustomers();
  }

  // =====================================================================
  // Page: Overview
  // =====================================================================
  function drawOverview() {
    const C = CTX, T = C.T, n = C.n, mIdx = C.mIdx, byM = C.byM;
    const col = pal();

    const mv = f => mIdx.map(i => byM[i] ? f(byM[i]) : 0);
    const sOrd = mv(x => F.status === 'All' ? sum(x.o.slice(0, 5)) : x.o[VG]);
    const sDone = mv(x => x.o[0]);
    const sRate = mv(x => rate(x) === null ? 0 : rate(x));
    const sAov = mv(x => x.o[0] ? x.v[0] / x.o[0] : 0);
    const sMom = C.series.map((v, i) => i > 0 && C.series[i - 1] > 0 ? (v / C.series[i - 1] - 1) * 100 : 0);
    const pct = s => (n >= 2 && s[n - 2] > 0) ? (s[n - 1] / s[n - 2] - 1) * 100 : null;
    const pp = s => n >= 2 ? s[n - 1] - s[n - 2] : null;

    const cards = [
      { l: VG === 0 ? 'Revenue (completed orders)' : 'Value of ' + GLABEL[GROUPS[VG]].toLowerCase() + ' orders',
        v: fmt2(T.v[VG]), s: C.series, d: pct(C.series), up: true },
      { l: 'Total orders', v: fmt(C.totalOrders), s: sOrd, d: pct(sOrd), up: true },
      { l: 'Completed orders', v: fmt(C.done), s: sDone, d: pct(sDone), up: true },
      { l: 'Cancellation rate', v: C.overall === null ? 'N/A' : C.overall.toFixed(2) + '%', s: sRate,
        d: pp(sRate), up: false, unit: ' pp' },
      { l: 'Average order value', v: C.done ? fmt2(T.v[0] / C.done) : 'N/A', s: sAov, d: pct(sAov), up: true },
      { l: n >= 2 ? 'Change: ' + MONTHS[F.to].name + ' vs ' + MONTHS[F.to - 1].name : 'Month-over-month change',
        v: C.mom === null ? 'N/A' : (C.mom >= 0 ? '+' : '') + C.mom.toFixed(1) + '%', s: sMom, d: null, up: true }
    ];
    $('kpis').innerHTML = cards.map((c, i) => {
      let dl = '&nbsp;';
      if (c.d !== null) {
        const good = c.up ? c.d >= 0 : c.d <= 0;
        dl = '<b class="' + (good ? 'pos' : 'neg') + '">' + (c.d >= 0 ? '▲ ' : '▼ ') + Math.abs(c.d).toFixed(1) +
             (c.unit || '%') + '</b> <span>vs prev month</span>';
      }
      return '<div class="card kpi"><div class="lbl">' + esc(c.l) + '</div><div class="val">' + c.v +
             '</div><div class="dl">' + dl + '</div><div class="spark" id="sp' + i + '"></div></div>';
    }).join('');
    cards.forEach((c, i) => spark('sp' + i, c.s, col[i % 2 === 0 ? 0 : 1]));

    drawTrend();
    drawInsights();
  }

  function drawTrend() {
    const C = CTX, s = C.series, n = C.n;
    const names = C.mIdx.map(i => MONTHS[i].name);
    const mom = s.map((v, i) => i > 0 && s[i - 1] > 0 ? (v / s[i - 1] - 1) * 100 : null);
    const total = sum(s), avg = n ? total / n : 0;
    let pk = 0, lw = 0;
    s.forEach((v, i) => { if (v > s[pk]) pk = i; if (v < s[lw]) lw = i; });
    const ch = mom.map((p, i) => ({ p: p, i: i })).filter(x => x.p !== null);
    const dec = ch.filter(x => x.p < 0);
    const ups = ch.filter(x => x.p > 0).length;
    const worst = dec.length ? dec.reduce((a, b) => b.p < a.p ? b : a) : null;

    // trend verdict: fitted slope + share of months that rose
    let slopePct = null;
    if (n >= 3 && avg > 0) {
      const mx = (n - 1) / 2;
      let num = 0, den = 0;
      s.forEach((v, i) => { num += (i - mx) * (v - avg); den += (i - mx) * (i - mx); });
      slopePct = num / den / avg * 100;
    }
    let verdict = 'Not enough months', vcls = '', vtxt = 'Select at least 3 months to judge the trend.';
    if (slopePct !== null && ch.length) {
      const upShare = ups / ch.length;
      if (slopePct > 3 && upShare >= 0.6) { verdict = 'Growing steadily'; vcls = 'good'; }
      else if (slopePct < -3 && upShare <= 0.4) { verdict = 'Declining'; vcls = 'bad'; }
      else { verdict = 'Not steady'; vcls = 'warn'; }
      vtxt = ups + ' of ' + ch.length + ' month changes were increases. Fitted trend: ' +
             (slopePct >= 0 ? '+' : '') + slopePct.toFixed(1) + '% of the average monthly value, per month.';
      if (n >= 6) {
        const a = sum(s.slice(0, 3)) / 3, b = sum(s.slice(-3)) / 3;
        if (a > 0) vtxt += ' The last 3 months average ' + pctTxt((b / a - 1) * 100) + ' vs the first 3.';
      }
    }

    const lastM = n >= 2 ? mom[n - 1] : null;
    const a1 = answerCard('good', 'Which month had the highest value?', names[pk] + '  ·  ' + short(s[pk]),
      (total > 0 ? (s[pk] / total * 100).toFixed(1) + '% of the selected period. ' : '') +
      (n > 1 ? 'Lowest: ' + names[lw] + ' (' + short(s[lw]) + ').' : ''));
    const a2 = answerCard(dec.length ? 'bad' : 'good', 'In which months did it fall?',
      dec.length ? dec.length + ' of ' + ch.length + ' months' : (ch.length ? 'No month fell' : 'Need 2+ months'),
      dec.length ? dec.slice(0, 6).map(x => names[x.i] + ' ' + pctTxt(x.p)).join(', ') +
        (dec.length > 6 ? ' ...' : '') + '. Biggest drop: ' + names[worst.i] + ' (' + pctTxt(worst.p) + ').' : '');
    const a3 = answerCard(lastM === null ? '' : lastM >= 0 ? 'good' : 'bad', 'Latest change vs previous month',
      lastM === null ? 'N/A' : pctTxt(lastM),
      lastM === null ? 'Need 2+ months with a non-zero start.' :
        names[n - 1] + ' ' + short(s[n - 1]) + ' vs ' + names[n - 2] + ' ' + short(s[n - 2]) + '.');
    const a4 = answerCard(vcls, 'Is revenue growing steadily?', verdict, vtxt);
    $('answers').innerHTML = a1 + a2 + a3 + a4;

    const col = { up: css('--good'), dn: css('--bad'), brand: css('--brand') };
    chart('c_month', {
      tooltip: Object.assign(tip(), { trigger: 'axis', formatter: ps => {
        const i = ps[0].dataIndex;
        return esc(names[i]) + '<br/><b>' + fmt(s[i]) + '</b>' +
               (mom[i] === null ? '' : '<br/>vs previous month: ' + pctTxt(mom[i]));
      } }),
      grid: { left: 10, right: 24, top: 56, bottom: 10, containLabel: true },
      xAxis: Object.assign({ type: 'category', data: names, boundaryGap: false }, ax(), { splitLine: { show: false } }),
      yAxis: Object.assign({ type: 'value' }, ax(), { axisLabel: { color: css('--mut'), fontSize: 11, formatter: short } }),
      series: [{
        type: 'line', smooth: 0.25,
        data: s.map((v, i) => ({ value: v, symbolSize: i === pk ? 15 : 9,
          itemStyle: { color: mom[i] !== null && mom[i] < 0 ? col.dn : col.brand,
                       borderColor: css('--card'), borderWidth: 2 } })),
        lineStyle: { width: 3, color: col.brand },
        areaStyle: { color: LG(0, 0, 0, 1, [{ offset: 0, color: hexA(col.brand, .35) }, { offset: 1, color: hexA(col.brand, 0) }]) },
        label: { show: true, position: 'top', distance: 8, lineHeight: 14,
          rich: { v: { color: css('--ink'), fontWeight: 700, fontSize: 11 },
                  u: { color: col.up, fontWeight: 700, fontSize: 10 },
                  d: { color: col.dn, fontWeight: 700, fontSize: 10 } },
          formatter: p => {
            const i = p.dataIndex, m = mom[i];
            return '{v|' + short(s[i]) + '}' + (m === null ? '' : '\n{' + (m >= 0 ? 'u|▲ ' : 'd|▼ ') + pctAbs(m) + '}');
          } },
        markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: css('--mut') },
                    label: { formatter: 'Avg ' + short(avg), color: css('--mut'), fontSize: 10 },
                    data: [{ yAxis: avg }] }
      }]
    });

    $('strip').innerHTML = names.map((nm, i) => {
      const m = mom[i];
      const cls = i === pk ? ' peak' : (i === lw && n > 2 ? ' low' : '');
      const tag = cls === ' peak' ? '<span class="tag" style="background:var(--good)">PEAK</span>' :
                  cls === ' low' ? '<span class="tag" style="background:var(--bad)">LOW</span>' : '';
      const mp = m === null ? '<span style="color:var(--mut)">-</span>' :
        '<span class="' + (m >= 0 ? 'pos' : 'neg') + '">' + (m >= 0 ? '▲ ' : '▼ ') + pctAbs(m) + '</span>';
      return '<div class="chip-m' + cls + '">' + tag + '<div class="mn">' + esc(nm) + '</div><div class="mv">' +
             short(s[i]) + '</div><div class="mp">' + mp + '</div></div>';
    }).join('');
  }

  function drawInsights() {
    const C = CTX, T = C.T, overall = C.overall, mom = C.mom;
    const ins = [];
    if (T.v[0] > 0 && T.v[1] > 0)
      ins.push(['Cancelled value', 'Cancelled orders hold ' + (T.v[1] / T.v[0]).toFixed(2) +
        'x the value of completed-order revenue (' + fmt(T.v[1]) + ' vs ' + fmt(T.v[0]) +
        '). This is potential lost sales; the data does not show why orders were cancelled.']);

    const worst = (map, labelFn) => Object.keys(map).filter(k => elig(map[k]) >= MIN_ORDERS)
      .map(k => [labelFn(k), rate(map[k])]).sort((a, b) => b[1] - a[1])[0];
    const ws = worst(C.byS, k => D.state[k]);
    if (ws && overall !== null)
      ins.push(['Highest cancellation: state', ws[0] + ' has the highest cancellation rate (' + ws[1].toFixed(1) +
        '%) among states with ' + MIN_ORDERS + '+ eligible orders, vs ' + overall.toFixed(1) +
        '% overall. Compare fulfilment, delivery and payment data for this area before drawing conclusions.']);
    const wp = worst(C.byP, k => D.pay[k]);
    if (wp && overall !== null)
      ins.push(['Highest cancellation: payment', wp[0] + ' has the highest cancellation rate (' + wp[1].toFixed(1) +
        '%) among payment methods with ' + MIN_ORDERS + '+ eligible orders, vs ' + overall.toFixed(1) +
        '% overall. Check the payment workflow for this method.']);

    const cats = topN(C.byC, k => D.cat[k], x => x.v[VG], 20);
    const catTotal = sum(cats.map(r => r[1]));
    if (cats.length && catTotal > 0) {
      const share = cats[0][1] / catTotal * 100;
      ins.push(['Category concentration', cats[0][0] + ' accounts for ' + share.toFixed(1) + '% of the ' + VLAB +
        (share >= 40 ? '. Results depend heavily on this one category, so check the others separately.' : '.')]);
    }
    if (mom !== null && mom < 0)
      ins.push(['Month-over-month decline', 'Value fell ' + Math.abs(mom).toFixed(1) + '% in ' + MONTHS[F.to].name +
        ' compared with ' + MONTHS[F.to - 1].name + '. Compare order volume and cancellations for those months.']);
    if (!ins.length) ins.push(['No alerts', 'No insight rule was triggered for this selection.']);

    $('insights').innerHTML = ins.slice(0, 6).map(i =>
      '<div class="card insight"><h4>' + esc(i[0]) + '</h4><div>' + esc(i[1]) + '</div></div>').join('');
  }

  // =====================================================================
  // Page: Product & Category
  // =====================================================================
  function prodRows() {
    const catName = F.cat === 'All' ? null : D.cat[+F.cat];
    const m = {};
    EX.prod.forEach(r => {
      if (r.m < F.from || r.m > F.to) return;
      if (F.region !== 'All' && r.rg !== F.region) return;
      if (catName !== null && EX.skuCat[r.s] !== catName) return;
      const x = m[r.s] || (m[r.s] = { s: r.s, co: 0, v: 0, ca: 0, rf: 0 });
      x.co += r.co; x.v += r.v; x.ca += r.ca; x.rf += r.rf;
    });
    return Object.keys(m).map(k => m[k]);
  }

  function drawProduct() {
    const C = CTX;

    // ---- products ----
    if (!EX) {
      $('c_topRev').innerHTML = '<div class="mut">' + esc(exMsg()) + '</div>';
      $('c_topOrd').innerHTML = '<div class="mut">' + esc(exMsg()) + '</div>';
    } else {
      const pr = prodRows();
      const topRev = pr.slice().sort((a, b) => b.v - a.v).filter(x => x.v > 0).slice(0, 10);
      leader('c_topRev', topRev.map(x => ({ name: EX.skus[x.s], val: x.v, txt: short(x.v), mono: true,
        sub: EX.skuCat[x.s] + '  ·  ' + fmt(x.co) + ' orders' })));
      const topOrd = pr.slice().sort((a, b) => b.co - a.co).filter(x => x.co > 0).slice(0, 10);
      leader('c_topOrd', topOrd.map(x => ({ name: EX.skus[x.s], val: x.co, txt: fmt(x.co), mono: true,
        sub: EX.skuCat[x.s] + '  ·  ' + short(x.v) + ' revenue', color: ['#a78bfa', '#3b82f6'] })));
    }

    // ---- categories ----
    const catV = topN(C.byC, k => D.cat[k], x => x.v[VG], 20).filter(r => r[1] > 0);
    const catTot = sum(catV.map(r => r[1]));
    leader('c_cat', catV.map(r => ({ name: r[0], val: r[1],
      txt: short(r[1]) + (catTot ? '<span class="pc">' + (r[1] / catTot * 100).toFixed(1) + '%</span>' : '') })),
      { compact: true });
    const overallR = C.overall;
    leader('c_catrate', rateRows(C.byC, k => D.cat[k]).map(r => ({ name: r[0], val: r[1], txt: r[1].toFixed(1) + '%',
      color: overallR === null ? null : r[1] >= overallR + 5 ? ['#fb923c', '#ef4444'] :
             r[1] > overallR ? ['#fbbf24', '#f59e0b'] : ['#34d399', '#10b981'] })),
      { compact: true, note: overallR === null ? '' : 'Overall cancellation: ' + overallR.toFixed(1) +
        '%. Red = 5+ points above overall, amber = above overall, green = at or below.' });

    const cr = Object.keys(C.byC).map(k => {
      const x = C.byC[k], el = elig(x);
      return { name: D.cat[k], rev: x.v[0], o: sum(x.o.slice(0, 5)), ca: x.o[1], cv: x.v[1],
               r: el >= MIN_ORDERS ? rate(x) : null };
    });
    const totRev = sum(cr.map(x => x.rev)), meanRev = cr.length ? totRev / cr.length : 0;
    const overall = C.overall;
    cr.forEach(x => {
      x.share = totRev ? x.rev / totRev * 100 : 0;
      x.low = x.rev < 0.5 * meanRev;
      x.hi = x.r !== null && overall !== null && x.r >= overall + 5;
      x.flag = (x.low ? 1 : 0) + (x.hi ? 2 : 0);
    });

    // quadrant: revenue vs cancellation
    const pts = cr.filter(x => x.rev > 0 && x.r !== null);
    if (!pts.length) noData('c_quad');
    else chart('c_quad', {
      tooltip: Object.assign(tip(), { trigger: 'item', formatter: p =>
        esc(p.name) + '<br/>Revenue: <b>' + fmt(p.value[0]) + '</b><br/>Cancellation: <b>' +
        p.value[1].toFixed(1) + '%</b><br/>Orders: ' + fmt(p.value[2]) }),
      grid: { left: 10, right: 40, top: 44, bottom: 34, containLabel: true },
      graphic: [{ type: 'text', left: 56, top: 10, style: { text: 'Top-left = low revenue + high cancellation',
        fill: css('--bad'), fontSize: 11, fontWeight: 700 } }],
      xAxis: Object.assign({ type: 'log', name: 'Revenue (log scale)', nameLocation: 'middle', nameGap: 26,
        nameTextStyle: { color: css('--mut'), fontSize: 11 } }, ax(),
        { axisLabel: { color: css('--mut'), fontSize: 11, formatter: short } }),
      yAxis: Object.assign({ type: 'value', min: 0, name: 'Cancellation %',
        nameTextStyle: { color: css('--mut'), fontSize: 11 } }, ax(),
        { axisLabel: { color: css('--mut'), fontSize: 11, formatter: v => v + '%' } }),
      series: [{
        type: 'scatter',
        data: pts.map(x => ({ name: x.name, value: [x.rev, x.r, x.o],
          itemStyle: { color: x.flag === 3 ? '#ef4444' : x.flag ? '#f59e0b' : css('--brand'), opacity: .85 } })),
        symbolSize: v => Math.max(14, Math.min(60, Math.sqrt(v[2]) / 8)),
        label: { show: true, position: 'right', formatter: p => p.name, color: css('--ink'), fontSize: 10 },
        markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: css('--mut') },
          label: { color: css('--mut'), fontSize: 10 },
          data: [{ xAxis: Math.max(meanRev, 1e-9), label: { formatter: 'Avg revenue' } }]
                .concat(overall !== null ? [{ yAxis: overall, label: { formatter: 'Overall ' + overall.toFixed(1) + '%' } }] : []) }
      }]
    });

    // answer cards
    const withRev = cr.filter(x => x.rev >= 0);
    const lowC = withRev.length ? withRev.reduce((a, b) => b.rev < a.rev ? b : a) : null;
    const hiC = cr.filter(x => x.r !== null).sort((a, b) => b.r - a.r)[0];
    const mostC = cr.length ? cr.reduce((a, b) => b.ca > a.ca ? b : a) : null;
    const both = cr.filter(x => x.flag === 3);
    $('catAns').innerHTML =
      (lowC ? answerCard('warn', 'Which category has the lowest revenue?', lowC.name,
        fmt(lowC.rev) + ' (' + lowC.share.toFixed(1) + '% of all categories).') : '') +
      (hiC ? answerCard('bad', 'Highest cancellation rate', hiC.name + '  ·  ' + hiC.r.toFixed(1) + '%',
        overall !== null ? 'Overall rate is ' + overall.toFixed(1) + '%.' : '') : '') +
      (mostC ? answerCard('bad', 'Most cancelled orders', mostC.name,
        fmt(mostC.ca) + ' cancelled orders, worth ' + short(mostC.cv) + '.') : '') +
      answerCard(both.length ? 'bad' : 'good', 'Low revenue AND high cancellation',
        both.length ? both.map(x => x.name).join(', ') : 'None',
        'Low revenue = under half of the average category. High cancellation = 5+ points above overall.');
  }

  // =====================================================================
  // Page: Geographic
  // =====================================================================
  function cityRows() {
    const m = {};
    EX.city.forEach(r => {
      if (r.m < F.from || r.m > F.to) return;
      if (F.region !== 'All' && EX.cityRegion[r.c] !== F.region) return;
      const x = m[r.c] || (m[r.c] = { c: r.c, co: 0, ca: 0, rf: 0, v: 0 });
      x.co += r.co; x.ca += r.ca; x.rf += r.rf; x.v += r.v;
    });
    return Object.keys(m).map(k => {
      const x = m[k], el = x.co + x.ca + x.rf;
      return { n: EX.cities[x.c], v: round2(x.v), el: el, ca: x.ca, r: el >= MIN_CITY ? x.ca / el * 100 : null };
    }).filter(x => x.el > 0);
  }

  function tileMap(rows) {
    const metric = SEG.map;
    const base = metric === 'rate' ? '#ef4444' : metric === 'lost' ? '#f59e0b' : css('--brand');
    const vals = {};
    rows.forEach(r => {
      const v = metric === 'rate' ? r.r : metric === 'lost' ? r.cv : r.v;
      if (v !== null && v !== undefined) vals[r.n] = v;
    });
    const max = Math.max.apply(null, Object.keys(vals).map(k => vals[k]).concat([1e-9]));
    const f = metric === 'rate' ? (v => v.toFixed(0) + '%') : short;
    let html = '';
    Object.keys(TILES).forEach(code => {
      const v = vals[code], t = TILES[code];
      let st = 'grid-column:' + (t[0] + 1) + ';grid-row:' + (t[1] + 1) + ';';
      if (v === undefined) {
        st += 'background:' + css('--card2') + ';color:' + css('--mut') + ';opacity:.45;';
        html += '<div class="tile" style="' + st + '" title="' + code + ': no data">' + code + '</div>';
      } else {
        const k = metric === 'rate' ? v / max : Math.sqrt(v / max);
        const a = 0.14 + 0.86 * k;
        st += 'background:' + hexA(base, a) + ';color:' + (a > 0.55 ? '#04141f' : css('--ink')) + ';';
        html += '<div class="tile" style="' + st + '" title="' + code + ': ' + (metric === 'rate' ? v.toFixed(1) + '%' : fmt(v)) +
                '">' + code + '<small>' + f(v) + '</small></div>';
      }
    });
    $('c_map').innerHTML = '<div class="tmap">' + html + '</div>' +
      '<div class="legend">Low <i style="background:linear-gradient(90deg,' + hexA(base, .14) + ',' + base +
      ')"></i> High (' + f(max) + ')</div>';
  }

  function drawGeo() {
    const C = CTX;
    bars('c_region', topN(C.byR, k => k, x => x.v[VG], 20), {});

    // state rows with trend (last 3 months vs the 3 before)
    const byStM = groupBy(C.base, r => r.st + '|' + r.m);
    const L3 = C.mIdx.slice(-3), P3 = C.n >= 6 ? C.mIdx.slice(-6, -3) : [];
    const sv = (k, list) => sum(list.map(m => byStM[k + '|' + m] ? byStM[k + '|' + m].v[VG] : 0));
    const st = Object.keys(C.byS).map(k => {
      const x = C.byS[k], el = elig(x);
      const p = P3.length ? sv(k, P3) : 0;
      return { n: D.state[k], rg: CUBE.regionOf[D.state[k]], v: x.v[VG],
               o: F.status === 'All' ? sum(x.o.slice(0, 5)) : x.o[VG], el: el,
               r: el >= MIN_STATE ? rate(x) : null, cv: x.v[1],
               tr: p > 0 ? (sv(k, L3) / p - 1) * 100 : null };
    });

    tileMap(st);

    const byV = st.slice().sort((a, b) => b.v - a.v);
    bars('c_stTop', byV.slice(0, 10).map(x => [x.n, round2(x.v)]), { h: true, lw: 60 });
    bars('c_stLow', byV.slice().reverse().slice(0, 10).map(x => [x.n, round2(x.v)]),
      { h: true, lw: 60, c1: '#ef4444', c2: '#fb923c' });

    // opportunity signals
    const ins = [];
    const rec = st.slice().sort((a, b) => b.cv - a.cv).filter(x => x.cv > 0).slice(0, 3);
    if (rec.length)
      ins.push(['Recovery opportunity', 'Most cancelled order value: ' +
        rec.map(x => x.n + ' ' + short(x.cv)).join(', ') +
        '. Fewer cancellations in these states would add the most revenue. This is potential, not a forecast.']);
    const weak = byV.slice().reverse().slice(0, 3);
    const totV = sum(st.map(x => x.v));
    if (weak.length && totV > 0)
      ins.push(['Weakest states', weak.map(x => x.n + ' ' + short(x.v) + ' (' + (x.v / totV * 100).toFixed(1) + '%)').join(', ') +
        '. Check whether this is small market size or under-served demand.']);
    const tr = st.filter(x => x.tr !== null && x.el >= MIN_STATE).sort((a, b) => b.tr - a.tr);
    if (tr.length >= 2)
      ins.push(['Momentum (last 3 months vs previous 3)', 'Rising: ' +
        tr.slice(0, 3).map(x => x.n + ' ' + pctTxt(x.tr)).join(', ') + '. Falling: ' +
        tr.slice(-3).reverse().map(x => x.n + ' ' + pctTxt(x.tr)).join(', ') + '.']);
    if (EX) {
      const hc = cityRows().filter(x => x.r !== null).sort((a, b) => b.r - a.r).slice(0, 3);
      if (hc.length)
        ins.push(['Highest cancellation: cities', hc.map(x => x.n + ' ' + x.r.toFixed(0) + '% (' + fmt(x.el) + ' orders)').join(', ') +
          ' (cities with ' + MIN_CITY + '+ orders).']);
    }
    if (!ins.length) ins.push(['No signals', 'Not enough data for this selection.']);
    $('geoIns').innerHTML = ins.map(i =>
      '<div class="card insight"><h4>' + esc(i[0]) + '</h4><div>' + esc(i[1]) + '</div></div>').join('');

    table('t_state', [
      { k: 'n', t: 'State' },
      { k: 'rg', t: 'Region' },
      { k: 'v', t: VG === 0 ? 'Revenue' : 'Value', num: true, bar: true, f: v => fmt(v) },
      { k: 'o', t: 'Orders', num: true, f: v => fmt(v) },
      { k: 'r', t: 'Cancel %', num: true, f: ratePct },
      { k: 'cv', t: 'Cancelled value', num: true, f: v => fmt(v) },
      { k: 'tr', t: 'Trend (3 mo)', num: true, f: trendCell }
    ], st, { sort: 'v', max: 60 });

    if (!EX) $('t_city').innerHTML = '<div class="mut">' + esc(exMsg()) + '</div>';
    else table('t_city', [
      { k: 'n', t: 'City' },
      { k: 'v', t: 'Revenue', num: true, bar: true, f: v => fmt(v) },
      { k: 'el', t: 'Orders', num: true, f: v => fmt(v) },
      { k: 'ca', t: 'Cancelled orders', num: true, f: v => fmt(v) },
      { k: 'r', t: 'Cancel %', num: true, f: ratePct }
    ], cityRows(), { sort: 'v', max: 100 });
  }

  // =====================================================================
  // Page: Payment & Orders
  // =====================================================================
  function drawPay() {
    const C = CTX;
    const ms = Object.keys(C.byP).map(k => {
      const x = C.byP[k], o = sum(x.o.slice(0, 5));
      return { k: k, name: D.pay[k], o: o, oc: x.o, done: x.o[0], ca: x.o[1], rf: x.o[2],
               r: elig(x) >= MIN_ORDERS ? rate(x) : null, rev: x.v[0], aov: x.o[0] ? x.v[0] / x.o[0] : null };
    });
    const totO = sum(ms.map(m => m.o));
    ms.forEach(m => m.share = totO ? m.o / totO * 100 : 0);

    donut('c_pay', topN(C.byP, k => D.pay[k], x => sum(x.o.slice(0, 5)), 12), { sub: 'orders' });

    const st = GROUPS.map((g, i) => ({ g: g, v: C.T.o[i] })).filter(x => x.v > 0);
    donut('c_status', st.map(x => [GLABEL[x.g], x.v]), { sub: 'orders', colors: st.map(x => SCOL[x.g]) });

    bars('c_payrate', rateRows(C.byP, k => D.pay[k]), { h: true, c1: '#ef4444', c2: '#fb923c',
      f: v => v + '%', tipf: v => v + '%' });

    // 100% stacked: status mix per payment method
    const top8 = ms.slice().sort((a, b) => b.o - a.o).filter(m => m.o > 0).slice(0, 8);
    if (!top8.length) noData('c_paystack');
    else chart('c_paystack', {
      tooltip: Object.assign(tip(), { trigger: 'axis', axisPointer: { type: 'shadow' },
        valueFormatter: v => v.toFixed(1) + '%' }),
      legend: { top: 0, textStyle: { color: css('--mut'), fontSize: 11 }, icon: 'circle', itemHeight: 8, itemWidth: 8 },
      grid: { left: 10, right: 20, top: 34, bottom: 10, containLabel: true },
      xAxis: Object.assign({ type: 'value', max: 100 }, ax(), { axisLabel: { color: css('--mut'), fontSize: 11, formatter: v => v + '%' } }),
      yAxis: Object.assign({ type: 'category', inverse: true, data: top8.map(m => m.name) }, ax(),
        { splitLine: { show: false }, axisLabel: { color: css('--ink'), fontSize: 11, width: 110, overflow: 'truncate' } }),
      series: GROUPS.map((g, gi) => ({
        name: GLABEL[g], type: 'bar', stack: 'a', barMaxWidth: 26,
        itemStyle: { color: SCOL[g] },
        label: { show: true, color: '#fff', fontSize: 10, formatter: p => p.value >= 7 ? p.value.toFixed(0) + '%' : '' },
        data: top8.map(m => m.o ? m.oc[gi] / m.o * 100 : 0)
      }))
    });

    // revenue (bars) + orders (line)
    const topR = ms.slice().sort((a, b) => b.rev - a.rev).filter(m => m.o > 0).slice(0, 8);
    if (!topR.length) noData('c_paycombo');
    else chart('c_paycombo', {
      tooltip: Object.assign(tip(), { trigger: 'axis', axisPointer: { type: 'shadow' },
        valueFormatter: v => fmt(v) }),
      legend: { top: 0, textStyle: { color: css('--mut'), fontSize: 11 } },
      grid: { left: 10, right: 10, top: 40, bottom: 10, containLabel: true },
      xAxis: Object.assign({ type: 'category', data: topR.map(m => m.name) }, ax(),
        { splitLine: { show: false }, axisLabel: { color: css('--mut'), fontSize: 11, interval: 0, rotate: 30 } }),
      yAxis: [
        Object.assign({ type: 'value', name: 'Revenue', nameTextStyle: { color: css('--mut'), fontSize: 11 } }, ax(),
          { axisLabel: { color: css('--mut'), fontSize: 11, formatter: short } }),
        Object.assign({ type: 'value', name: 'Orders', nameTextStyle: { color: css('--mut'), fontSize: 11 } }, ax(),
          { splitLine: { show: false }, axisLabel: { color: css('--mut'), fontSize: 11, formatter: short } })
      ],
      series: [
        { name: 'Revenue (completed)', type: 'bar', barMaxWidth: 30, data: topR.map(m => round2(m.rev)),
          itemStyle: { borderRadius: [6, 6, 0, 0],
            color: LG(0, 1, 0, 0, [{ offset: 0, color: hexA(css('--brand2'), .85) }, { offset: 1, color: css('--brand') }]) } },
        { name: 'Orders', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 8, data: topR.map(m => m.o),
          lineStyle: { width: 3, color: '#f59e0b' }, itemStyle: { color: '#f59e0b' } }
      ]
    });

    // monthly trend by payment method (top 5 + other)
    const byPM = groupBy(C.base, r => r.pay + '|' + r.m);
    const val = (k, m) => { const x = byPM[k + '|' + m]; return x ? (SEG.pm === 'rev' ? x.v[0] : sum(x.o.slice(0, 5))) : 0; };
    const tot = ms.map(m => ({ name: m.name, k: m.k, t: sum(C.mIdx.map(i => val(m.k, i))) }))
                  .sort((a, b) => b.t - a.t);
    const top5 = tot.slice(0, 5), rest = tot.slice(5);
    const names = C.mIdx.map(i => MONTHS[i].name);
    const colors = pal();
    const ser = top5.map((m, i) => ({ name: m.name, type: 'line', stack: 'pm', smooth: true, symbol: 'none',
      lineStyle: { width: 2, color: colors[i % colors.length] }, itemStyle: { color: colors[i % colors.length] },
      areaStyle: { opacity: .55 }, data: C.mIdx.map(mm => round2(val(m.k, mm))) }));
    if (rest.length) ser.push({ name: 'Other', type: 'line', stack: 'pm', smooth: true, symbol: 'none',
      lineStyle: { width: 2, color: '#94a3b8' }, itemStyle: { color: '#94a3b8' }, areaStyle: { opacity: .55 },
      data: C.mIdx.map(mm => round2(sum(rest.map(m => val(m.k, mm))))) });
    chart('c_paytrend', {
      color: colors,
      tooltip: Object.assign(tip(), { trigger: 'axis', valueFormatter: v => fmt(v) }),
      legend: { top: 0, textStyle: { color: css('--mut'), fontSize: 11 }, icon: 'circle', itemHeight: 8, itemWidth: 8 },
      grid: { left: 10, right: 20, top: 40, bottom: 10, containLabel: true },
      xAxis: Object.assign({ type: 'category', data: names, boundaryGap: false }, ax(), { splitLine: { show: false } }),
      yAxis: Object.assign({ type: 'value' }, ax(), { axisLabel: { color: css('--mut'), fontSize: 11, formatter: short } }),
      series: ser
    });

    table('t_pay', [
      { k: 'name', t: 'Payment method' },
      { k: 'o', t: 'Orders', num: true, bar: true, f: v => fmt(v) },
      { k: 'done', t: 'Completed', num: true, f: v => fmt(v) },
      { k: 'ca', t: 'Cancelled', num: true, f: v => fmt(v) },
      { k: 'rf', t: 'Refunded', num: true, f: v => fmt(v) },
      { k: 'r', t: 'Cancel %', num: true, f: ratePct },
      { k: 'rev', t: 'Revenue (completed)', num: true, f: v => fmt(v) },
      { k: 'aov', t: 'Avg order value', num: true, f: v => v === null ? '-' : fmt2(v) },
      { k: 'share', t: 'Share of orders', num: true, f: v => v.toFixed(1) + '%' }
    ], ms, { sort: 'o' });
  }

  // =====================================================================
  // Page: Customers
  // =====================================================================
  function drawCustomers() {
    const gv = {}, av = {};
    CUS.filter(r => r.m >= F.from && r.m <= F.to && r.g === VG).forEach(r => {
      const g = D.gender[r.ge], a = D.age[r.ag];
      gv[g] = (gv[g] || 0) + r.v;
      av[a] = (av[a] || 0) + r.v;
    });
    donut('c_gender', Object.keys(gv).map(k => [k === 'M' ? 'Male' : k === 'F' ? 'Female' : k, gv[k]]), { sub: 'value' });
    bars('c_age', AGE_ORDER.filter(a => a in av).map(a => [a, av[a]]));
  }
</script>
