<style>
  :root {
    --font: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    --good: #34d399; --bad: #f87171; --warn: #f59e0b; --radius: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #071320; --side: #0a1a2b; --card: #0e2236; --card2: #132f48;
    --ink: #e8f1fb; --mut: #8ba3bb; --line: rgba(148,180,210,.15);
    --brand: #22d3ee; --brand2: #3b82f6;
    --shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f1f5f9; --side: #ffffff; --card: #ffffff; --card2: #f5f8fb;
    --ink: #17212b; --mut: #64748b; --line: rgba(15,23,42,.09);
    --brand: #2563eb; --brand2: #0ea5e9;
    --good: #059669; --bad: #dc2626; --warn: #d97706;
    --shadow: 0 4px 18px rgba(15,23,42,.07);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; }

  .shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .side { width: 232px; flex: none; background: var(--side); border-right: 1px solid var(--line);
          padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
          position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px;
           padding: 4px 8px 20px; letter-spacing: -.01em; }
  .logo { width: 34px; height: 34px; border-radius: 10px; color: #fff; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--brand), var(--brand2)); }
  .nav-h { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--mut); padding: 4px 10px 8px; }
  .nav { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: 0;
         background: transparent; color: var(--mut); font: inherit; font-weight: 600; border-radius: 10px;
         cursor: pointer; text-align: left; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav:hover { background: var(--card2); color: var(--ink); }
  .nav.active { color: var(--ink); background: linear-gradient(90deg, rgba(34,211,238,.18), rgba(59,130,246,.06));
                box-shadow: inset 3px 0 0 var(--brand); }
  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
  .built { font-size: 10px; color: var(--mut); padding: 8px 12px 0; word-break: break-all; }

  /* ---------- Main ---------- */
  .main { flex: 1 1 auto; min-width: 0; max-width: 1440px; margin: 0 auto; padding: 22px 26px 44px; }
  .loading { color: var(--mut); padding: 40px 0; }
  .topbar { margin-bottom: 14px; }
  .topbar h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .topbar small { color: var(--mut); }

  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--card);
             border: 1px solid var(--line); padding: 12px 16px; border-radius: var(--radius);
             box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 5; }
  .filters label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--mut);
                   text-transform: uppercase; letter-spacing: .05em; }
  select { padding: 8px 10px; font: inherit; font-size: 13px; color: var(--ink); background: var(--card2);
           border: 1px solid var(--line); border-radius: 8px; min-width: 120px; outline: none; }
  select:focus { border-color: var(--brand); }
  button#fReset { cursor: pointer; padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; border: 0;
                  border-radius: 8px; background: linear-gradient(135deg, var(--brand), var(--brand2)); }
  #warn { color: var(--bad); margin-top: 8px; }

  /* ---------- Cards / grids ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card h4 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-h h4 { margin: 0; }
  .row { display: grid; gap: 14px; margin-top: 14px; grid-template-columns: 1fr; }
  .r-2-1 { grid-template-columns: 2fr 1fr; }
  .r-1-2 { grid-template-columns: 1fr 2fr; }
  .r-1-1 { grid-template-columns: 1fr 1fr; }
  .r-1-1-1 { grid-template-columns: repeat(3, 1fr); }
  .chart { height: 320px; }
  .tall { height: 460px; }
  h3.sec { margin: 26px 0 0; font-size: 16px; }
  .sec-h { margin: 28px 0 0; }
  .sec-h h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .sec-h p { margin: 4px 0 0; color: var(--mut); font-size: 13px; }
  .mut { color: var(--mut); font-size: 12px; }
  .note { margin-top: 26px; line-height: 1.6; }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .kpi { padding: 14px 16px 6px; overflow: hidden; }
  .kpi .lbl { font-size: 12px; color: var(--mut); font-weight: 600; }
  .kpi .val { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 2px; }
  .kpi .dl { font-size: 11px; font-weight: 700; min-height: 15px; }
  .kpi .dl span { color: var(--mut); font-weight: 500; }
  .kpi .spark { height: 48px; margin: 4px -8px 0; }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  /* ---------- Answer cards ---------- */
  .answers { display: grid; gap: 14px; grid-auto-rows: 1fr; }
  .ans { padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
         border-left: 4px solid var(--brand); }
  .ans .q { font-size: 12px; color: var(--mut); font-weight: 600; }
  .ans .a { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .ans .d { font-size: 12px; color: var(--mut); line-height: 1.5; }
  .ans.good { border-left-color: var(--good); } .ans.good .a { color: var(--good); }
  .ans.bad { border-left-color: var(--bad); } .ans.bad .a { color: var(--bad); }
  .ans.warn { border-left-color: var(--warn); } .ans.warn .a { color: var(--warn); }

  /* ---------- Month strip ---------- */
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; padding-top: 6px; }
  .chip-m { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px 10px;
            text-align: center; position: relative; }
  .chip-m .mn { font-size: 11px; color: var(--mut); font-weight: 600; }
  .chip-m .mv { font-size: 16px; font-weight: 800; margin: 3px 0; }
  .chip-m .mp { font-size: 11px; font-weight: 700; }
  .chip-m.peak { outline: 2px solid var(--good); }
  .chip-m.low { outline: 2px solid var(--bad); }
  .chip-m .tag { position: absolute; top: -8px; right: 6px; font-size: 9px; font-weight: 800; padding: 1px 7px;
                 border-radius: 8px; color: #fff; letter-spacing: .04em; }

  /* ---------- Segmented control ---------- */
  .seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--mut); font: inherit; font-size: 12px; font-weight: 600;
                padding: 5px 11px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }

  /* ---------- Tile map ---------- */
  .tmap { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; max-width: 760px; margin: 4px auto 0; }
  .tile { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center;
          justify-content: center; font-size: 11px; font-weight: 800; line-height: 1.1; cursor: default;
          transition: transform .12s; }
  .tile:hover { transform: scale(1.12); position: relative; z-index: 2; }
  .tile small { font-size: 9px; font-weight: 600; opacity: .85; }
  .legend { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 12px;
            font-size: 11px; color: var(--mut); }
  .legend i { display: block; width: 160px; height: 8px; border-radius: 4px; }

  /* ---------- Tables ---------- */
  .scroll { max-height: 460px; overflow: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; text-align: left;
            padding: 8px; border-bottom: 1px solid var(--line); font-weight: 600; white-space: nowrap;
            position: sticky; top: 0; background: var(--card); z-index: 1; }
  .tbl th.s { cursor: pointer; user-select: none; }
  .tbl th.s:hover { color: var(--ink); }
  .tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl .bar { height: 4px; border-radius: 2px; margin-top: 5px; margin-left: auto;
              background: linear-gradient(90deg, var(--brand), var(--brand2)); }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .chip.bad { background: rgba(248,113,113,.18); color: var(--bad); }
  .chip.warn { background: rgba(245,158,11,.18); color: var(--warn); }
  .chip.ok { background: rgba(52,211,153,.16); color: var(--good); }

  /* ---------- Leaderboard lists ---------- */
  .lb { display: flex; flex-direction: column; gap: 14px; }
  .lb.compact { gap: 10px; }
  .lb-r { display: flex; gap: 12px; align-items: flex-start; }
  .lb .rk { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center;
            font-size: 12px; font-weight: 800; background: var(--card2); color: var(--mut); }
  .lb .rk.top { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
  .lb-c { flex: 1; min-width: 0; }
  .lb-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .lb .nm { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .nm.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .lb .vl { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lb .vl .pc { font-size: 11px; font-weight: 600; color: var(--mut); margin-left: 4px; }
  .lb-bar { height: 6px; border-radius: 3px; background: var(--card2); margin-top: 6px; overflow: hidden; }
  .lb.compact .lb-bar { margin-top: 4px; }
  .lb-bar i { display: block; height: 100%; border-radius: 3px; }
  .lb-sub { font-size: 11px; color: var(--mut); margin-top: 4px; }
  .lb-note { font-size: 12px; color: var(--mut); line-height: 1.5; }

  /* ---------- Insights ---------- */
  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; margin-top: 12px; }
  .insight { border-left: 4px solid var(--brand); font-size: 13px; line-height: 1.55; color: var(--mut); }
  .insight h4 { color: var(--ink); margin-bottom: 6px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .r-2-1, .r-1-2, .r-1-1, .r-1-1-1 { grid-template-columns: 1fr; }
    .answers { grid-auto-rows: auto; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  }
  @media (max-width: 800px) {
    .shell { flex-direction: column; }
    .side { position: static; width: 100%; height: auto; flex-direction: row; align-items: center;
            overflow-x: auto; padding: 10px; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 0 8px 0 4px; } .brand span, .nav-h, .built { display: none; }
    .nav { width: auto; white-space: nowrap; padding: 8px 12px; }
    .nav.active { box-shadow: inset 0 -3px 0 var(--brand); }
    .side-foot { margin: 0 0 0 auto; border: 0; padding: 0; }
    .main { padding: 14px 12px 36px; }
    .filters { position: static; }
    select { min-width: 100px; }
    .tile { font-size: 9px; border-radius: 5px; } .tile small { display: none; }
    .topbar h1 { font-size: 22px; }
  }
</style>
